[package]
name = "vizualisation"
description = "vizualisation: the 3D map of the Pāli canon, Leptos SSR + hydrate on palicanon-ui-lib."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# From search-front/app/Cargo.toml, without the API client: this service reads its own
# data files (the `formats` crate, task 004).
[dependencies]
# Pinned by tag (docs conventions/ui-lib.md); in development the workspace's [patch]
# builds from ../ui-lib, and the tag must hold the standalone manifest.
palicanon-ui-lib = { version = "0.4", git = "ssh://git@github.com/PaliCanon/ui-lib.git", tag = "v0.4.0" }
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
# This service's own strings, a typed catalogue generated by build.rs (like ui-lib's):
# read in ui-lib's `language_signal`, not leptos_i18n's.
leptos_i18n = { version = "0.6.2", default-features = false }
leptos_axum = { workspace = true, optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"], optional = true }
# The data files' types (task 004): read at boot on the server, and in the browser by the
# map's logic (`map/`, shared by ssr and hydrate; serde only, it builds for wasm32).
map-formats = { version = "0.1.0", path = "../formats" }
# The first render's decisions travel to the browser in the page (`map::first`, a Leptos
# `SharedValue`, JSON): the panel and its parts derive `Serialize`/`Deserialize`.
serde = { version = "1", features = ["derive"] }
# Search folds diacritics as the React page did (`normalize`, src/map/data.ts: NFD, then the
# combining marks dropped).
unicode-normalization = "0.1"
# The origin guard and the password gate compare their secrets in constant time
# (`origin.rs`, `gate.rs`); the gate decodes HTTP Basic credentials.
subtle = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
# Serves the site's files before the app's routes (`router.rs`); already in the
# tree through leptos_axum.
tower-http = { version = "0.6", features = ["fs"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# The map's data files are fetched by the browser (`map/fetch.rs`): a fetch's future, its
# bytes.
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
# The site's `MapData` (`map/site_data.rs`) hands its fetch, not `Send` in a browser, behind
# the trait's `Send` future (already in the tree through leptos, with `futures`).
send_wrapper = { version = "0.6", features = ["futures"], optional = true }

# `EngineView` (map/engine_view.rs) in the browser: the map engine (wgpu, task 004) and the
# DOM it is driven through (the canvas, pointer, wheel and key events, ResizeObserver,
# requestAnimationFrame); the map's wiring (`map/live.rs`): its cookies, the history entry's
# trail, the device's colour scheme, the data files' responses. `browser` only (hydrate or
# csr), and wasm32 only: the server renders the empty canvas.
[target.'cfg(target_arch = "wasm32")'.dependencies]
map-engine = { version = "0.1.0", path = "../engine", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "AddEventListenerOptions",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomStringMap",
  "Element",
  "Event",
  "EventTarget",
  "History",
  "HtmlCanvasElement",
  "HtmlDocument",
  "HtmlElement",
  "KeyboardEvent",
  "MediaQueryList",
  "MouseEvent",
  "NodeList",
  "Performance",
  "PointerEvent",
  "ResizeObserver",
  "Response",
  "WheelEvent",
  "Window",
  "console",
] }

[build-dependencies]
# As in ui-lib's build.rs: the parser's diagnostics fail the build on a missing key.
leptos_i18n_parser = "=0.6.2"
leptos_i18n_codegen = "=0.6.2"
# ui-lib's build/placeholders.rs when ui-lib sits beside this repository; `None` in a cargo
# git checkout (the PaliCanon app's), where the check is skipped with a warning (task 012).
vizualisation-i18n-check = { version = "0.1.0", path = "../i18n-check" }

[dev-dependencies]
serde_json = "1"
# Drive the document test (learn-pali/app/Cargo.toml): the head the meta
# context collected is injected into the rendered stream as `leptos_axum`
# does, which awaits a tick of the global executor (both already in the lock).
futures = "0.3"
any_spawner = { version = "0.3", features = ["tokio"] }
# The router tests send requests through it (`tower::ServiceExt::oneshot`).
tower = { version = "0.5", features = ["util"] }

# The browser test of the fragment (tests/csr.rs), run by wasm-bindgen-test-runner in a
# headless Chrome (task 012): the runner's crate, the page's events and storage, and the
# engine's count of its live views.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
map-engine = { version = "0.1.0", path = "../engine" }
web-sys = { version = "0.3", features = [
  "HtmlDocument",
  "History",
  "Location",
  "PointerEvent",
  "PointerEventInit",
  "PopStateEvent",
  "Storage",
] }

[features]
# The site (map.palicanon.app) is built with `ssr` (the server) and `hydrate` (the browser
# takes the server's page over); the PaliCanon app with `csr` alone (the browser builds the
# map from an empty document, no server: `MapRoutes` and `MapProvider`, task 012). Exactly
# one of the three per build (ci.yml has a clippy entry each; never `--all-features`).
#
# Private: the code that needs a browser — EngineView's engine and DOM wiring, the live map's
# data loads, history, colour scheme and listeners, the folded sections' storage, the search
# shortcut —, shared by the two client modes. Never gate it on `hydrate`; always on wasm32
# as well (`all(feature = "browser", target_arch = "wasm32")`): `csr` builds on the host,
# where the PaliCanon app runs its native tests (task 012).
browser = [
  "dep:send_wrapper",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:js-sys",
  "dep:map-engine",
  "dep:web-sys",
]
hydrate = [
  "leptos/hydrate",
  "palicanon-ui-lib/hydrate",
  "browser",
  "dep:console_error_panic_hook",
]
# The PaliCanon app: no server, the preferences in localStorage (ui-lib's `csr::mount`).
csr = ["leptos/csr", "palicanon-ui-lib/csr", "browser"]
ssr = [
  "dep:axum",
  "dep:tokio",
  "dep:leptos_axum",
  "dep:subtle",
  "dep:base64",
  "dep:tower-http",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "palicanon-ui-lib/ssr",
]

[lints]
workspace = true
