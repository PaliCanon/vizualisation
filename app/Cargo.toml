[package]
name = "vizualisation"
description = "vizualisation: the 3D map of the Pāli canon, Leptos SSR + hydrate on palicanon-ui-lib."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# From search-front/app/Cargo.toml, without the API client: this service reads its own
# data files (the `formats` crate, task 004).
[dependencies]
# Pinned by tag (docs conventions/ui-lib.md); in development the workspace's [patch]
# builds from ../ui-lib, and the tag must hold the standalone manifest.
palicanon-ui-lib = { version = "0.1", git = "ssh://git@github.com/PaliCanon/ui-lib.git", tag = "v0.1.1" }
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
# This service's own strings, a typed catalogue generated by build.rs (like ui-lib's):
# read in ui-lib's `language_signal`, not leptos_i18n's.
leptos_i18n = { version = "0.6.2", default-features = false }
leptos_axum = { workspace = true, optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"], optional = true }
# The origin guard and the password gate compare their secrets in constant time
# (`origin.rs`, `gate.rs`); the gate decodes HTTP Basic credentials.
subtle = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
# Serves the site's files before the app's routes (`router.rs`); already in the
# tree through leptos_axum.
tower-http = { version = "0.6", features = ["fs"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[build-dependencies]
# As in ui-lib's build.rs: the parser's diagnostics fail the build on a missing key.
leptos_i18n_parser = "=0.6.2"
leptos_i18n_codegen = "=0.6.2"
# Reads the locale files for the placeholder-parity check (ui-lib's build/placeholders.rs).
serde_json = "1"

[dev-dependencies]
serde_json = "1"
# Drive the document test (learn-pali/app/Cargo.toml): the head the meta
# context collected is injected into the rendered stream as `leptos_axum`
# does, which awaits a tick of the global executor (both already in the lock).
futures = "0.3"
any_spawner = { version = "0.3", features = ["tokio"] }
# The router tests send requests through it (`tower::ServiceExt::oneshot`).
tower = { version = "0.5", features = ["util"] }

[features]
hydrate = [
  "leptos/hydrate",
  "palicanon-ui-lib/hydrate",
  "dep:console_error_panic_hook",
  "dep:wasm-bindgen",
]
ssr = [
  "dep:axum",
  "dep:tokio",
  "dep:leptos_axum",
  "dep:subtle",
  "dep:base64",
  "dep:tower-http",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "palicanon-ui-lib/ssr",
]

[lints]
workspace = true
