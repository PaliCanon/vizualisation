[package]
name = "map-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A 3D graph renderer for the web (wgpu: WebGPU, WebGL2 fallback): points, links, orbit camera, picking. Knows no corpus."
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
map-layout = { version = "0.1.0", path = "../layout" }

[lints]
workspace = true
