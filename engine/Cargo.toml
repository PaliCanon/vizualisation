[package]
name = "map-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A 3D graph renderer for the web (wgpu: WebGPU, WebGL2 fallback): points, links, orbit camera, picking. Knows no corpus."
license = "CC-BY-NC-4.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
