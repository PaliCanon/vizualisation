# From learn-pali/Cargo.toml (workspace package, lints, wasm-release profile) and
# search-front/Cargo.toml. Task 005 adds the `app` member, the leptos workspace
# dependencies and metadata, and the ui-lib [patch].
[workspace]
resolver = "3"
members = ["app", "engine", "layout", "formats"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "CC-BY-NC-4.0"
repository = "https://github.com/PaliCanon/vizualisation"

[workspace.dependencies]
leptos = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
leptos_axum = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
# Every public item is documented; CI denies warnings, so this is enforced.
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow" # the app's components take their props by value

# The service: `cargo leptos watch` serves it on http://127.0.0.1:3301 (learn-pali 3201,
# search-front 3101; README.md).
[[workspace.metadata.leptos]]
name = "vizualisation"
bin-package = "vizualisation"
lib-package = "vizualisation"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "app/style/main.css"
assets-dir = "app/public"
site-addr = "127.0.0.1:3301"
reload-port = 4301
bin-features = ["ssr"]
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"
# Hashed file names (`vizualisation.<hash>.css`, `.js`, `.wasm`), as learn-pali: a new
# build is never served from a cache of the old one. The server reads the hash file
# `cargo-leptos` writes next to its binary (`hash.txt`) when LEPTOS_HASH_FILES=true.
hash-files = true

# Built from ../ui-lib (a worktree reaches it through the wt/ui-lib symlink), not from
# GitHub: a change to both repositories is seen at once.
[patch."ssh://git@github.com/PaliCanon/ui-lib.git"]
palicanon-ui-lib = { path = "../ui-lib" }

# A member's own [profile.*] is ignored in a workspace: the engine's size-optimised wasm
# profile lives here. `npm run build:engine` builds with it.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
