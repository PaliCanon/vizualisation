# From learn-pali/deny.toml (its licence list and policy), without the leptos-only advisory
# ignores and the ui-lib git source: task 005 adds those with the app crate.
[advisories]
version = 2
ignore = []

[licenses]
version = 2
# PaliCanon's own licence (every PaliCanon crate is CC-BY-NC-4.0), then permissive
# licences for the dependencies.
allow = [
    "CC-BY-NC-4.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allow list is a policy, not an inventory of the current tree.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
