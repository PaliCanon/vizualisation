name: CI

# The Rust workspace (root Cargo.toml: engine, layout, formats) gets learn-pali's jobs, run for the
# host and for wasm32 (the GPU view, the layout and the formats also build there); the site is
# type-checked and built on top. Every cargo step names its packages with `-p`, never
# `--workspace`: the app crate (task 005) has ssr and hydrate features that do not build together.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            args: --all-targets
          # The inline tests are host-only (learn-pali's "core-wasm" entry is --lib too).
          - target: wasm32-unknown-unknown
            args: --lib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - run: cargo clippy --locked -p map-engine -p map-layout -p map-formats ${{ matrix.args }} --target ${{ matrix.target }} -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p map-engine -p map-layout -p map-formats

  docs:
    name: rustdoc (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, wasm32-unknown-unknown]
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo doc --no-deps --locked -p map-engine -p map-layout -p map-formats --target ${{ matrix.target }}

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: wasm32-unknown-unknown
      # --locked: the MSRV claim is verified against the committed Cargo.lock.
      - run: cargo check --locked -p map-engine -p map-layout -p map-formats
      - run: cargo check --locked -p map-engine -p map-layout -p map-formats --target wasm32-unknown-unknown

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
          command: check advisories bans sources licenses
          arguments: --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The coverage table goes to the job summary; Codecov only once a CODECOV_TOKEN exists
      # (none of the organisation's repositories has one yet).
      - run: |
          cargo llvm-cov --locked -p map-engine -p map-layout -p map-formats --lcov --output-path lcov.info
          { echo '```'; cargo llvm-cov report --summary-only; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v5
        if: env.CODECOV_TOKEN != ''
        with:
          files: lcov.info
          fail_ci_if_error: true

  site:
    name: site (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
