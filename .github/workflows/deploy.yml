name: deploy

# Tag v* builds the image and pushes it to GHCR (ghcr.io/palicanon/vizualisation);
# that is all this workflow does. A push to main deploys nothing (CI only).
#
# Prod runs on the lsh-tech server (ssh.lsh.tech, repo Lsh0x/lsh-tech, stack
# stacks/palicanon/prod): it pulls the image BY DIGEST, and the stack is
# updated by hand with the digest and the `h-` tag that the job summary
# prints. Nothing here reaches the server.
#
# The image is content-addressed: its tag `h-...` is a hash of what shapes it
# (app, engine, layout, formats, i18n-check, the Cargo files, the Dockerfile,
# scripts/, the data files, and the ui-lib commit built against;
# scripts/image-hash.sh), so it is built only when those inputs changed. The
# release (the tag v0.1.8, the commit) is NOT in the image, so the hash does
# not change with the ref: a release tag on an image that already exists is
# added to it without a rebuild.
#
# From search-front/.github/workflows/deploy.yml. What differs: one sibling
# (ui-lib), the image name, and the registry (GHCR, signed in with the run's
# own GITHUB_TOKEN).
#
# Repository secrets: APP_ID, APP_PRIVATE_KEY — the GitHub App (Contents:
#   read on ui-lib and vizualisation) that the `siblings` action mints its
#   token from. The push to GHCR uses the automatic GITHUB_TOKEN. Nothing
#   else is a secret here: the image build takes no credential (Dockerfile).

on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

# Two checkouts side by side: the build context is the folder holding
# vizualisation/ and ui-lib/. Commands run in vizualisation/.
defaults:
  run:
    working-directory: vizualisation

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: vizualisation
          persist-credentials: false
      - uses: ./vizualisation/.github/actions/siblings
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The tag is computed ONCE, after both checkouts, and used by the
      # build, the existence check and the summary (scripts/image-hash.sh:
      # the tracked inputs, the Dockerfile text and scripts/ included, plus
      # the ui-lib commit built against).
      - name: Compute the input hash and image refs
        id: vars
        run: |
          set -euo pipefail
          TAG=$(scripts/image-hash.sh ../ui-lib)
          IMAGE=ghcr.io/palicanon/vizualisation
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_hash=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
          echo "vizualisation: input hash $TAG (ui-lib $(git -C ../ui-lib rev-parse --short HEAD))"

      # The password goes through `with:`, never through a `run:` line.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `docker buildx imagetools` needs buildx, so it is set up before the
      # existence check, whether or not the build runs.
      - uses: docker/setup-buildx-action@v3

      - name: Check whether that image already exists
        id: check-image
        env:
          IMAGE_HASH: ${{ steps.vars.outputs.image_hash }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE_HASH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "vizualisation: $IMAGE_HASH already built, skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        if: steps.check-image.outputs.exists != 'true'
        with:
          # `working-directory` does not apply to `uses:` steps: the context
          # is the workspace root, the folder holding the two checkouts.
          context: .
          file: vizualisation/Dockerfile
          # No `secrets:`, no `ssh:`: the build takes no credential (the
          # sibling is COPYed and the lock holds no git source).
          push: true
          # The `h-` tag is what the existence check reads; the release tag
          # (v0.1.8) is a second name for the same image.
          tags: |
            ${{ steps.vars.outputs.image_hash }}
            ${{ steps.vars.outputs.image }}:${{ github.ref_name }}
          # Links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # No build args, on purpose: the release is not in the image, so
          # its hash does not change with the ref.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image of this input hash exists: it is not rebuilt, the release
      # tag is added to it.
      - name: Add the release tag to the existing image
        if: steps.check-image.outputs.exists == 'true'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          IMAGE_HASH: ${{ steps.vars.outputs.image_hash }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:$REF" "$IMAGE_HASH"

      # What the stack takes: the digest, read back from the registry (the
      # image just built, or the one that already existed).
      - name: Summary, the digest to put in the stack
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          IMAGE_HASH: ${{ steps.vars.outputs.image_hash }}
          TAG: ${{ steps.vars.outputs.tag }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "$IMAGE_HASH" --format '{{json .Manifest}}' | jq -r .digest)
          test -n "$DIGEST" || { echo "::error::no digest for $IMAGE_HASH"; exit 1; }
          {
            echo "### Image pushed to GHCR"
            echo
            echo "- pinned ref: \`$IMAGE@$DIGEST\`"
            echo "- hash tag: \`$TAG\`"
            echo "- release tag: \`$REF\`"
            echo
            echo "The stack (Lsh0x/lsh-tech, stacks/palicanon/prod) is updated by hand with this digest."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "vizualisation: $IMAGE@$DIGEST"
